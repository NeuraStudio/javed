publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  flutter_markdown: ^0.7.4
  webview_flutter: ^4.7.0
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
